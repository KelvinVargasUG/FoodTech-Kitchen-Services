spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

jwt:
  secret: "test-secret-should-be-long-enough-for-hs256-123456"
  expirationSeconds: 3600

feature:
  product-bulk-upload:
    enabled: true
  product-catalog:
    enabled: true

upload:
  storage:
    base-path: /tmp/foodtech-test
  max-file-size-bytes: 10485760  # 10 MB
