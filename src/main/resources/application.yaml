spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/foodtech_db
    username: foodtech_user
    password: foodtech_pass
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

jwt:
  secret: "change-me-dev-secret-should-be-32-chars-min"
  expirationSeconds: 3600

upload:
  storage:
    base-path: /tmp/foodtech/uploads
  max-file-size-bytes: 10485760  # 10 MB

feature:
  product-catalog:
    enabled: true
  product-bulk-upload:
    enabled: true
